<!-- Advanced Hero Section with Layered Building Animation -->
<main class="relative isolate overflow-hidden pt-16 pb-24 sm:pt-24 sm:pb-32 min-h-screen" 
      id="animated-hero-advanced">
    <!-- Strong light overlay to make image appear faded -->
    <div class="absolute inset-0 bg-white/90 -z-10"></div>

    <!-- Multi-Layer Building Animation -->
    <div class="absolute inset-0 -z-20 w-full h-full overflow-hidden">
        <!-- Background buildings layer (slower rise) -->
        <div class="building-animation-wrapper" aria-hidden="true">
            <img src="/assets/images/building-vector-png-clipart-background.svg" 
                 alt="" 
                 class="building-animation building-layer-bg w-full h-auto"
                 style="filter: brightness(0.9) contrast(0.9);">
        </div>

        <!-- Middle buildings layer (medium rise) -->
        <div class="building-animation-wrapper" aria-hidden="true">
            <img src="/assets/images/building-vector-png-clipart-background.svg" 
                 alt="" 
                 class="building-animation building-layer-middle w-full h-auto delay-200"
                 style="filter: brightness(0.95) contrast(1); opacity: 0.95;">
        </div>
         
        <!-- Front buildings layer (faster rise) -->
        <div class="building-animation-wrapper" aria-hidden="true">
            <img src="/assets/images/building-vector-png-clipart-background.svg" 
                 alt="" 
                 class="building-animation building-layer-front w-full h-auto delay-300"
                 style="filter: brightness(1) contrast(1.05); opacity: 1;">
        </div>
    </div>

    <!-- Content Container -->
    <div class="relative z-10 max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-nv-gray-700">
            Your <span class="bg-gradient-to-r from-nv-blue to-nv-teal bg-clip-text text-transparent">AI first</span> platform for Modern <span class="bg-gradient-to-r from-nv-blue to-nv-teal bg-clip-text text-transparent">Real Estate Growth</span>
        </h1>
        <p class="mt-6 text-lg leading-8 text-nv-gray-700 max-w-xl mx-auto italic">
           Empowering real estate worldwide – from pitch to payment and design to delivery- with seamless customer first experience.
        </p>
        <div class="mt-10 flex items-center justify-center gap-x-6">
             <!-- Schedule Demo Button (Primary) -->
             <a href="#" class="rounded-xl bg-nv-blue px-5 py-2.5 text-sm font-semibold text-white shadow-md hover:bg-nv-teal hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-nv-blue shadow-blue-md hover:shadow-teal-glow transition-all duration-150 ease-in-out">
                 Schedule Demo
             </a>
             <!-- Explore Features Button (Secondary) -->
             <a href="#" class="rounded-xl bg-white px-5 py-2.5 text-sm font-semibold text-nv-blue shadow-sm ring-1 ring-inset ring-nv-gray-200 hover:bg-nv-gray-50 transition-colors duration-150">
                Explore Features <span aria-hidden="true">→</span>
             </a>
        </div>
    </div>

    <!-- Background blur shapes using brand colors -->
    <div class="absolute left-1/2 top-0 -z-10 -translate-x-1/2 blur-3xl xl:-top-6" aria-hidden="true">
         <div class="aspect-[1155/678] w-[72.1875rem] bg-gradient-to-tr from-nv-teal/30 to-nv-blue/30 opacity-30" style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)"></div> 
    </div>
</main>
<!-- End Advanced Hero Section -->
