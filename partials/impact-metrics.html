/* Make number animations */
@keyframes countUp {

<!-- JavaScript for animations -->
<script>
// This script will add animation to the neural network visualization
document.addEventListener('DOMContentLoaded', function() {
    // Add a small delay to ensure everything is loaded
    setTimeout(() => {
        // First animate the central logo with a pulse effect
        const logo = document.querySelector('.central-logo');
        if (logo) {
            logo.style.transition = 'transform 0.5s ease-in-out';
            logo.style.transform = 'scale(1.05)';
            setTimeout(() => {
                logo.style.transform = 'scale(1)';
            }, 500);
        }
        
        // Then animate the stat boxes sequentially
        const statBoxes = document.querySelectorAll('.stat-box');
        statBoxes.forEach((box, index) => {
            setTimeout(() => {
                box.style.opacity = '0';
                box.style.transform = 'translateY(20px)';
                box.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
                
                setTimeout(() => {
                    box.style.opacity = '1';
                    box.style.transform = 'translateY(0)';
                }, 100);
            }, index * 200);
        });
    }, 300);
});
</script>
